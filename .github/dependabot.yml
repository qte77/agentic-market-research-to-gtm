version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      # Majors stay out of this group, so each arrives as its own PR.
      actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
